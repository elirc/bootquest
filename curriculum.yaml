# BootQuest source registry (spec §3.2) — the repos `bootquest sync` / `npm run seed:sync` walk.
#
#   repo        owner/name on GitHub (case-sensitive, never slugged)
#   role        curriculum | reference | corpus
#               curriculum: a docs/curriculum/program.json (signalpost v2 schema) registers as units
#               reference:  markdown registers as content_refs (study/reference material)
#               corpus:     raw material for seed generators (quizzes, katas)
#   pinned_sha  optional: sync this exact commit instead of the default branch HEAD
#   include     optional: only markdown under these path prefixes is registered
#   exclude     optional: markdown under these path prefixes is never registered
#
# Parsed by a strict YAML subset (server/src/sync/yaml.ts) and Zod-validated
# (shared/src/sync.ts CurriculumConfig). Unsupported YAML is refused, not guessed.
version: 1
sources:
  - repo: elirc/signalpost-swe-bootcamp
    role: curriculum
    # apps/web/public/guides/Uxx.md are byte-identical generated copies of docs/curriculum/Uxx.md
    # (signalpost's own check-curriculum.ts enforces the parity) — register the canonical ones only
    exclude: [apps/web/public/guides/, node_modules/]
  - repo: elirc/relay-upskilling
    role: reference
  - repo: elirc/harbor-swe-bootcamp
    role: reference
  - repo: elirc/csbootcamp
    role: reference
